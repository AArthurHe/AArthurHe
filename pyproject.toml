[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surf-tps-stitcher"
version = "1.0.0"
description = "Image stitching using SURF/SIFT with Thin Plate Spline (TPS) fusion"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "AArthurHe"}
]
keywords = ["image-stitching", "surf", "sift", "thin-plate-spline", "opencv", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.19.0",
    "opencv-python>=4.5.0",
    "opencv-contrib-python>=4.5.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.3.0",
]

[project.scripts]
stitch-images = "src.surf_tps_stitcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
